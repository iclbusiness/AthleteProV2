<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - AthletePro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="messages">
  <!-- Header -->
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-name">AthletePro</span>
            <span class="logo-tagline">Recruit • Connect • Succeed</span>
          </div>
        </a>
        <div class="nav-links">
          <a href="reels.html" class="nav-link">Reels</a>
          <a href="feed.html" class="nav-link">Feed</a>
          <a href="gameday.html" class="nav-link">Game Day</a>
          <a href="index.html#browse" class="nav-link">Discover</a>
          <div id="navUserDisplay" class="auth-logged-in"></div>
          <a href="login.html" class="btn btn-secondary btn-sm auth-logged-out">Log In</a>
          <a href="signup.html" class="btn btn-primary auth-logged-out">Sign Up</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Messages Container -->
  <main class="messages-container">
    <div class="container">
      <div class="messages-layout">

        <!-- Conversations Sidebar -->
        <aside class="messages-sidebar">
          <div class="messages-sidebar-header">
            <h2>Messages</h2>
            <button class="new-chat-btn" onclick="showNewConversationModal()">+ New</button>
          </div>
          <div class="messages-search">
            <input type="text" id="messageSearchInput" placeholder="Search conversations..."
              class="search-input">
          </div>
          <div id="conversationsList" class="conversations-list">
            <!-- Rendered by JS -->
          </div>
        </aside>

        <!-- Message Thread -->
        <section class="messages-thread">
          <div id="threadHeader" class="thread-header">
            <div class="empty-thread-header" style="flex:1;">
              <div class="empty-icon">💬</div>
              <h3>Select a conversation</h3>
            </div>
          </div>
          <div id="messageThread" class="message-thread-content">
            <div class="empty-thread-content">
              <div class="empty-icon">✉️</div>
              <h3>Your messages</h3>
              <p>Select a conversation or start a new one.</p>
            </div>
          </div>
          <div id="composeArea" class="compose-area hidden">
            <div class="compose-input-container">
              <textarea
                id="messageInput"
                placeholder="Type a message…"
                rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessageHandler();}"
              ></textarea>
              <button class="btn btn-primary send-btn" onclick="sendMessageHandler()">Send</button>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- New Conversation Modal -->
  <div id="newConversationModal" class="modal-overlay hidden">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h3 style="font-size:1.05rem;">New Conversation</h3>
        <button class="modal-close" onclick="hideNewConversationModal()">×</button>
      </div>

      <!-- Tab bar -->
      <div style="display:flex;border-bottom:1px solid var(--border-light);">
        <button id="dmTabBtn" class="modal-tab-btn active" onclick="switchConversationTab('dm')">
          Direct Message
        </button>
        <button id="groupTabBtn" class="modal-tab-btn" onclick="switchConversationTab('group')">
          Group Chat
        </button>
      </div>

      <!-- DM Tab -->
      <div id="dmTabContent" class="modal-body">
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label style="display:block;margin-bottom:0.4rem;color:var(--text-secondary);font-size:0.82rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;">Search users</label>
          <input type="text" id="userSearchInput" class="form-control"
            placeholder="Name or email…" oninput="searchUsersForConversation()">
        </div>
        <div id="userSearchResults" class="user-search-results">
          <p class="search-hint">Type at least 2 characters to search</p>
        </div>
      </div>

      <!-- Group Tab -->
      <div id="groupTabContent" class="modal-body hidden">
        <div class="form-group" style="margin-bottom:1rem;">
          <label style="display:block;margin-bottom:0.4rem;color:var(--text-secondary);font-size:0.82rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;">Group name</label>
          <input type="text" id="groupNameInput" class="form-control"
            placeholder="e.g. Offensive Line, Team Coaches…">
        </div>

        <div style="margin-bottom:0.5rem;">
          <label style="display:block;margin-bottom:0.4rem;color:var(--text-secondary);font-size:0.82rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;">Members</label>
          <div id="selectedMembersList" class="selected-members-list">
            <span style="color:var(--text-muted);font-size:0.82rem;">No members added yet</span>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:0.75rem;">
          <input type="text" id="groupUserSearchInput" class="form-control"
            placeholder="Search to add members…" oninput="searchUsersForGroupAdd()">
        </div>
        <div id="groupUserSearchResults" class="user-search-results"></div>

        <button class="btn btn-primary" style="width:100%;margin-top:1rem;"
          onclick="createGroupConversationHandler()">
          Create Group Chat
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
