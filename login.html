<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - AthletePro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <!-- Header -->
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-name">AthletePro</span>
            <span class="logo-tagline">Recruit • Connect • Succeed</span>
          </div>
        </a>
        <div class="nav-links">
          <a href="reels.html" class="nav-link">Reels</a>
          <a href="feed.html" class="nav-link">Feed</a>
          <a href="gameday.html" class="nav-link">Game Day</a>
          <a href="index.html#browse" class="nav-link">Discover</a>
          <a href="signup.html" class="btn btn-primary">Sign Up</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Login Form -->
  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Log in to your AthletePro account</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block">Log In</button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
      </div>

      <div class="auth-features">
        <h3>Why AthletePro?</h3>
        <ul>
          <li>&#127942; Create multiple sport profiles</li>
          <li>&#127909; Share highlight reels</li>
          <li>&#128200; Track your stats</li>
          <li>&#127758; Get discovered by recruiters</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script type="module">
    import { auth } from './firebase.js';
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Already signed in — skip the login page
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'dashboard.html';
    });

    const form = document.getElementById('loginForm');
    const btn  = form.querySelector('[type="submit"]');

    form.onsubmit = async (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();

      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Logging in...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Keep localStorage auth in sync so the rest of the app keeps working
        if (typeof loginAccount === 'function') loginAccount(email, password);
        showToast('Welcome back!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) {
        btn.disabled    = false;
        btn.textContent = 'Log In';
        showToast(authErrMsg(err.code), 'error');
      }
    };

    function authErrMsg(code) {
      const msgs = {
        'auth/user-not-found':     'No account found with this email',
        'auth/wrong-password':     'Incorrect password',
        'auth/invalid-credential': 'Incorrect email or password',
        'auth/invalid-email':      'Invalid email address',
        'auth/too-many-requests':  'Too many attempts — try again later',
      };
      return msgs[code] || 'Login failed. Please try again';
    }
  </script>
</body>
</html>
