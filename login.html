<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - AthletePro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <!-- Header -->
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-name">AthletePro</span>
            <span class="logo-tagline">Recruit • Connect • Succeed</span>
          </div>
        </a>
        <div class="nav-links">
          <a href="reels.html" class="nav-link">Reels</a>
          <a href="feed.html" class="nav-link">Feed</a>
          <a href="gameday.html" class="nav-link">Game Day</a>
          <a href="index.html" class="nav-link">Athletes</a>
          <a href="signup.html" class="btn btn-primary">Sign Up</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Login Form -->
  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Log in to your AthletePro account</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block">Log In</button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
      </div>

      <div class="auth-features">
        <h3>Why AthleteHub?</h3>
        <ul>
          <li>&#127942; Create multiple sport profiles</li>
          <li>&#127909; Share highlight reels</li>
          <li>&#128200; Track your stats</li>
          <li>&#127758; Get discovered by recruiters</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
