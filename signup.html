<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AthletePro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="signup">
  <!-- Header -->
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-name">AthletePro</span>
            <span class="logo-tagline">Recruit • Connect • Succeed</span>
          </div>
        </a>
        <div class="nav-links">
          <a href="index.html#browse" class="nav-link">Browse Athletes</a>
          <a href="login.html" class="btn btn-secondary">Log In</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Signup Form -->
  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Join AthletePro</h1>
          <p>Create your account and start your journey</p>
        </div>

        <form id="signupForm" class="auth-form">
          <!-- Account Type Selection -->
          <div class="form-group">
            <label style="font-family:var(--font-condensed);font-size:0.7rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);">I Am A...</label>
            <div class="account-type-selector">
              <label class="account-type-option">
                <input type="radio" name="accountType" value="athlete" checked>
                <div class="account-type-card">
                  <span class="account-type-icon">🏃</span>
                  <span class="account-type-label">Athlete</span>
                  <span class="account-type-desc">Build your profile. Get recruited. Track every offer.</span>
                </div>
              </label>
              <label class="account-type-option">
                <input type="radio" name="accountType" value="scout">
                <div class="account-type-card">
                  <span class="account-type-icon">🔍</span>
                  <span class="account-type-label">Scout</span>
                  <span class="account-type-desc">Search talent. Manage your board. Find the next star.</span>
                </div>
              </label>
              <label class="account-type-option">
                <input type="radio" name="accountType" value="coach">
                <div class="account-type-card">
                  <span class="account-type-icon">📋</span>
                  <span class="account-type-label">Coach</span>
                  <span class="account-type-desc">Run your pipeline. Evaluate recruits. Build your roster.</span>
                </div>
              </label>
              <label class="account-type-option">
                <input type="radio" name="accountType" value="parent">
                <div class="account-type-card">
                  <span class="account-type-icon">🏠</span>
                  <span class="account-type-label">Parent</span>
                  <span class="account-type-desc">Support your athlete's journey to college sports.</span>
                </div>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" class="form-control" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" class="form-control" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" class="form-control" placeholder="At least 6 characters" required minlength="6">
          </div>

          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <input type="password" id="signupConfirmPassword" class="form-control" placeholder="Confirm your password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Log in</a></p>
        </div>
      </div>

      <div class="auth-features">
        <h3>One Account, Multiple Profiles</h3>
        <p>Create profiles for all your sports:</p>
        <div class="sport-icons">
          <span title="Soccer">&#9917;</span>
          <span title="Basketball">&#127936;</span>
          <span title="Football">&#127944;</span>
          <span title="Baseball">&#9918;</span>
          <span title="Volleyball">&#127952;</span>
          <span title="Track">&#127939;</span>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script type="module">
    import { auth, db } from './firebase.js';
    import {
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import {
      doc, setDoc
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Pre-select account type from URL param (?type=scout)
    const urlType = new URLSearchParams(window.location.search).get('type');
    if (urlType) {
      const radio = document.querySelector(`input[name="accountType"][value="${urlType}"]`);
      if (radio) radio.checked = true;
    }

    // Already signed in — skip signup (only redirect if localStorage auth is also in sync)
    onAuthStateChanged(auth, (user) => {
      if (user && typeof isLoggedIn === 'function' && isLoggedIn()) {
        window.location.href = 'dashboard.html';
      }
    });

    const form = document.getElementById('signupForm');
    const btn  = form.querySelector('[type="submit"]');

    form.onsubmit = async (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();

      const name     = document.getElementById('signupName').value.trim();
      const email    = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm  = document.getElementById('signupConfirmPassword').value;
      const type     = document.querySelector('input[name="accountType"]:checked')?.value || 'athlete';

      if (!name || !email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }
      if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
      }
      if (password !== confirm) {
        showToast('Passwords do not match', 'error');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Creating Account...';

      try {
        // Create Firebase Auth account
        const { user } = await createUserWithEmailAndPassword(auth, email, password);

        // Save profile to Firestore
        const ADMIN_EMAILS = ['ianlin.bts@gmail.com'];
        await setDoc(doc(db, 'users', user.uid), {
          name,
          email,
          accountType: type,
          isAdmin: ADMIN_EMAILS.includes(email.toLowerCase()),
          createdAt: new Date().toISOString()
        }, { merge: true });

        // Keep localStorage auth in sync so the rest of the app keeps working
        if (typeof createAccount === 'function') {
          createAccount(email, password, name, type);
          loginAccount(email, password);
        }

        const welcomes = {
          scout:  'Welcome Scout! Start discovering talent.',
          coach:  'Welcome Coach! Build your team.',
          parent: 'Welcome! Support your athlete.',
        };
        showToast(welcomes[type] || 'Welcome to AthletePro!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) {
        btn.disabled    = false;
        btn.textContent = 'Create Account';
        showToast(authErrMsg(err.code), 'error');
      }
    };

    function authErrMsg(code) {
      const msgs = {
        'auth/email-already-in-use': 'An account with this email already exists',
        'auth/invalid-email':        'Invalid email address',
        'auth/weak-password':        'Password too weak (min 6 characters)',
      };
      return msgs[code] || 'Sign up failed. Please try again';
    }
  </script>
</body>
</html>
